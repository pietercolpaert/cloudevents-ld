name: Playground

# Builds the playground and publishes it, with the vocabulary files it links to,
# on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that the examples' RDF is up to date
        run: |
          npm run build:examples
          git diff --exit-code -- examples || {
            echo "::error::examples/*/events.ttl is out of date: run 'npm run build:examples' and commit the result."
            exit 1
          }

      - name: Build the playground
        run: npm run build:playground

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
